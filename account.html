<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account — Ilorin Lifestyle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f3ee;color:#171717}
.wrap{max-width:900px;margin:0 auto;padding:32px 18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:24px;font-weight:800}.logo span{color:#c9822b}
a{text-decoration:none;color:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;border:1px solid #e4dfd7;border-radius:18px;padding:24px}
h1{font-size:34px;margin:0 0 8px}h2{margin-top:0}
p{color:#666}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;background:#171717;color:#fff;font-weight:700;cursor:pointer;margin-top:14px}
.secondary{background:#eee;color:#171717}
.msg{margin-top:12px;font-size:14px}
.user{display:none}.user.show{display:block}
.hidden{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="/">Ilorin <span>Lifestyle</span></a>
  <a href="/">← Back to city</a>
</header>

<h1>Your Ilorin Lifestyle account</h1>
<p>Create an account now. We'll add social features, messaging and profiles next.</p>

<div class="grid" id="authArea">
<section class="card">
<h2>Create account</h2>
<form id="registerForm">
<label>Display name</label>
<input id="regName" required maxlength="80" placeholder="e.g. Wisdom">
<label>Email</label>
<input id="regEmail" type="email" required placeholder="you@example.com">
<label>Password</label>
<input id="regPassword" type="password" required minlength="8" placeholder="At least 8 characters">
<button>Create account</button>
</form>
<div class="msg" id="registerMsg"></div>
</section>

<section class="card">
<h2>Log in</h2>
<form id="loginForm">
<label>Email</label>
<input id="loginEmail" type="email" required>
<label>Password</label>
<input id="loginPassword" type="password" required>
<button>Log in</button>
</form>
<div class="msg" id="loginMsg"></div>
</section>
</div>

<section class="card user" id="profileArea">
<h2>You're logged in 🎉</h2>
<p id="welcome"></p>
<form id="profileForm">
<label>Display name</label>
<input id="profileName" required maxlength="80">
<label>Bio</label>
<textarea id="profileBio" maxlength="500" placeholder="Tell people a little about yourself"></textarea>
<label>Avatar URL (optional)</label>
<input id="profileAvatar" placeholder="https://...">
<button>Save profile</button>
</form>
<button class="secondary" id="logout">Log out</button>
<div class="msg" id="profileMsg"></div>
</section>
</div>

<script>
async function api(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: {"Content-Type":"application/json", ...(options.headers||{})}
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function showUser(user){
  document.getElementById("authArea").classList.add("hidden");
  document.getElementById("profileArea").classList.add("show");
  document.getElementById("welcome").textContent = `Hello, ${user.display_name}. Your account is connected to PostgreSQL.`;
  document.getElementById("profileName").value = user.display_name || "";
  document.getElementById("profileBio").value = user.bio || "";
  document.getElementById("profileAvatar").value = user.avatar_url || "";
}

async function loadMe(){
  try{
    const data = await api("/api/me");
    if(data.user) showUser(data.user);
  }catch(e){}
}

document.getElementById("registerForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=document.getElementById("registerMsg");
  msg.textContent="Creating account...";
  try{
    const data=await api("/api/register",{method:"POST",body:JSON.stringify({
      displayName:document.getElementById("regName").value,
      email:document.getElementById("regEmail").value,
      password:document.getElementById("regPassword").value
    })});
    showUser(data.user);
  }catch(err){msg.textContent=err.message}
});

document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=document.getElementById("loginMsg");
  msg.textContent="Logging in...";
  try{
    const data=await api("/api/login",{method:"POST",body:JSON.stringify({
      email:document.getElementById("loginEmail").value,
      password:document.getElementById("loginPassword").value
    })});
    showUser(data.user);
  }catch(err){msg.textContent=err.message}
});

document.getElementById("profileForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=document.getElementById("profileMsg");
  try{
    const data=await api("/api/profile",{method:"PUT",body:JSON.stringify({
      displayName:document.getElementById("profileName").value,
      bio:document.getElementById("profileBio").value,
      avatarUrl:document.getElementById("profileAvatar").value
    })});
    msg.textContent="Profile saved.";
    showUser(data.user);
  }catch(err){msg.textContent=err.message}
});

document.getElementById("logout").addEventListener("click", async ()=>{
  await api("/api/logout",{method:"POST"});
  location.reload();
});

loadMe();
</script>
</body>
</html>
